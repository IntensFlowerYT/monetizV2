<script>
(() => {
const $ = (s, root=document) => root.querySelector(s);

const icon = (name, cls='icon') => `<i data-lucide="${name}" class="${cls}"></i>`;
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
// À CONFIGURER AVANT DE DISTRIBUER LE FICHIER. Un code partagé côté navigateur n'est pas une authentification sécurisée.
const TEAM_INVITE_CODE = 'FLOWER-TEAM-2026';
let studioState = {file:null,url:null,in:0,out:0,clips:[]};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateText = v => v ? new Date(v+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}) : 'Sans échéance';
const defaultData = () => ({projects:[{id:uid(),name:'Monetiz',description:'Organiser les outils et le workflow de la Team à Intense Flower.',category:'Organisation',status:'En cours',progress:35,created:new Date().toISOString().slice(0,10)},{id:uid(),name:'Haunted Harvest',description:'Développement Roblox, systèmes de jeu et corrections.',category:'Roblox Studio',status:'En cours',progress:60,created:new Date().toISOString().slice(0,10)}],tasks:[{id:uid(),title:'Définir les prochaines priorités',description:'Lister les tâches qui débloquent le plus le projet.',project:'Monetiz',status:'À faire',priority:'Haute',due:''},{id:uid(),title:'Préparer la prochaine session de montage',description:'Rassembler les clips et noter les séquences importantes.',project:'',status:'À faire',priority:'Normale',due:''}],notes:[],videos:[]});
let state={user:null,view:'dashboard',data:null,filter:'Tous',search:'',mobileNav:false};
const readUser = () => {try{return JSON.parse(localStorage.getItem('monetiz_user')||'null')}catch{return null}};

function saveData(){localStorage.setItem('monetiz_data_'+state.user.email,JSON.stringify(state.data));}
function saveUser(){localStorage.setItem('monetiz_user',JSON.stringify(state.user));}
function toast(msg){$('#toast-root').innerHTML=`<div class="toast">${icon('check-circle')} ${esc(msg)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',2600)}
function render(){if(!state.user){renderAuth();return}renderApp();if(window.lucide)lucide.createIcons()}
function renderAuth(mode='login',error=''){const register=mode==='register';$('#root').innerHTML=`<div class="auth-wrap"><form class="auth-card" id="auth-form"><div class="brand"><span class="brand-mark">${icon('layers','')}</span> monetiz</div><div class="eyebrow">INTENSE FLOWER · WORKSPACE</div><h1>${register?'Crée ton espace.':'Content de te revoir.'}</h1><p>${register?'Un espace de travail clair pour tes projets, tes tâches et tes montages.':'Connecte-toi pour reprendre tes projets là où tu les as laissés.'}</p>${register?`<div class="field"><label for="auth-name">Nom d’utilisateur</label><input class="input" id="auth-name" name="name" placeholder="Ton pseudo" minlength="2" maxlength="30" required></div><div class="field"><label for="auth-team-code">Code d’invitation Team</label><input class="input" id="auth-team-code" name="teamCode" placeholder="Code transmis par Intense Flower" required autocomplete="off"></div><div class="team-check">${icon('shield-check')}<div><strong>Accès réservé à la Team</strong><p>Le code est défini dans le fichier HTML par son propriétaire. Pour une vraie vérification non contournable, il faudra un serveur ou une connexion Discord OAuth.</p></div></div>`:''}<div class="field"><label for="auth-email">Adresse e-mail</label><input class="input" id="auth-email" name="email" type="email" autocomplete="email" placeholder="toi@exemple.com" required></div><div class="field"><label for="auth-password">Mot de passe</label><input class="input" id="auth-password" name="password" type="password" minlength="6" autocomplete="${register?'new-password':'current-password'}" placeholder="6 caractères minimum" required></div><button class="btn primary" style="width:100%;margin-top:5px" type="submit">${register?'Créer mon compte':'Se connecter'} ${icon('arrow-right')}</button>${error?`<div class="warning">${esc(error)}</div>`:''}<div class="auth-switch">${register?'Déjà inscrit ?':'Pas encore de compte ?'} <button class="text-btn" type="button" id="auth-switch">${register?'Se connecter':'Créer un compte'}</button></div><div class="footer-note">Prototype 100 % frontend : comptes et données restent sur cet appareil. Le code d’invitation est une barrière simple, pas une preuve d’identité sécurisée. Change TEAM_INVITE_CODE dans le fichier avant de le partager : le code actuel est un exemple et reste visible dans le HTML.</div></form></div>`;$('#auth-switch').onclick=()=>renderAuth(register?'login':'register');$('#auth-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),email=String(fd.get('email')).trim().toLowerCase(),password=String(fd.get('password'));let users={};try{users=JSON.parse(localStorage.getItem('monetiz_accounts')||'{}')}catch{}if(register){const name=String(fd.get('name')).trim(),teamCode=String(fd.get('teamCode')||'').trim();if(teamCode!==TEAM_INVITE_CODE)return renderAuth('register','Code Team invalide. Demande le code à Intense Flower.');if(users[email])return renderAuth('register','Un compte existe déjà pour cet e-mail.');users[email]={name,password,teamVerified:true};localStorage.setItem('monetiz_accounts',JSON.stringify(users));state.user={name,email};saveUser();state.data=defaultData();saveData();state.view='dashboard';render();toast('Compte créé sur cet appareil')}else{if(!users[email]||users[email].password!==password)return renderAuth('login','E-mail ou mot de passe incorrect.');if(!users[email].teamVerified)return renderAuth('login','Ce compte n’a pas été validé par le contrôle Team. Crée un compte avec le code d’invitation.');state.user={name:users[email].name,email};saveUser();state.data=readData();state.view='dashboard';render()}};if(window.lucide)lucide.createIcons()}

function videosHTML(){const clips=studioState.clips;return `<div class="view-title"><div><div class="eyebrow">PRODUCTION CRÉATIVE</div><h1>Studio de montage</h1><p>Prépare ton découpage avec tes vrais rushs, puis exporte une liste de coupes pour ton éditeur.</p></div><button class="btn primary" data-create="video">${icon('plus')} Nouveau projet vidéo</button></div><div class="panel" style="margin-bottom:15px"><div style="display:flex;gap:12px;align-items:flex-start"><span class="metric-icon">${icon('scissors')}</span><div><strong>Un assistant de découpage, pas une fausse simulation</strong><p class="muted small" style="margin:5px 0 0;line-height:1.7">Charge un fichier vidéo depuis ton ordinateur, repère les passages utiles, marque les points d’entrée et de sortie et exporte ta liste de coupes en CSV. Les fichiers restent sur ton appareil. Le montage final se fait dans ton logiciel vidéo.</p></div></div></div><div class="studio-layout"><section class="panel"><div class="subhead"><h2>${icon('monitor-play')} Lecteur de rushs</h2><span class="status gray" id="studio-file-status">Aucun fichier</span></div><div class="field"><label for="studio-file">Importer une vidéo depuis ton appareil</label><input class="input" id="studio-file" type="file" accept="video/*"></div><div class="video-stage" id="video-stage"><div class="video-placeholder">${icon('file-video')}<div><strong>Charge un rush pour commencer</strong></div><div class="small" style="margin-top:6px">MP4, WebM, MOV selon ton navigateur</div></div></div><div class="time-readout"><span>Position : <strong id="studio-current">00:00.000</strong></span><span>Durée : <strong id="studio-duration">--:--</strong></span></div><div class="studio-controls"><button class="btn" id="mark-in" disabled>${icon('log-in')} Marquer le début</button><button class="btn" id="mark-out" disabled>${icon('log-out')} Marquer la fin</button><button class="btn primary" id="add-clip" disabled>${icon('scissors')} Ajouter la coupe</button></div><div class="time-readout"><span>Début sélectionné : <strong id="studio-in">00:00.000</strong></span><span>Fin : <strong id="studio-out">--:--.---</strong></span></div><div class="studio-tip">Astuce : lance la vidéo, mets en pause au moment précis, puis marque le début ou la fin. Une coupe est ajoutée à ta feuille de montage avec le nom du rush et ses timecodes.</div></section><section class="panel"><div class="subhead"><h2>${icon('list-video')} Feuille de montage</h2><span class="status" id="clip-count">${clips.length} coupe${clips.length!==1?'s':''}</span></div><div class="field"><label for="clip-label">Nom de la séquence (facultatif)</label><input class="input" id="clip-label" placeholder="Ex. : intro, meilleur moment, transition…"></div><div class="field"><label for="clip-note">Note de montage (facultatif)</label><textarea class="textarea" id="clip-note" style="min-height:72px" placeholder="Texte à afficher, effet sonore, zoom, transition…"></textarea></div><div id="clip-list">${clips.length?clips.map((c,i)=>`<div class="clip-row"><div><strong>${i+1}. ${esc(c.label||'Séquence sans titre')}</strong><small>${esc(c.fileName)}${c.note?' · '+esc(c.note):''}</small><span class="clip-time">${esc(fmtTime(c.start))} → ${esc(fmtTime(c.end))} · ${esc(fmtTime(c.end-c.start))}</span></div><button class="btn icon-only ghost danger" data-delete-clip="${c.id}" title="Retirer cette coupe">${icon('trash-2')}</button></div>`).join(''):`<div class="empty">${icon('scissors')}<div>Aucune coupe repérée.</div><p class="small">Les coupes que tu marques apparaîtront ici.</p></div>`}</div><div class="studio-controls"><button class="btn primary" id="export-clips" ${clips.length?'':'disabled'}>${icon('download')} Exporter en CSV</button><button class="btn" id="clear-clips" ${clips.length?'':'disabled'}>${icon('trash-2')} Vider la liste</button></div><div class="studio-tip">Le CSV contient les noms, timecodes, durées et notes. Tu peux l’ouvrir dans un tableur ou l’utiliser comme feuille de route pe function fmtTime(seconds){if(!Number.isFinite(seconds)||seconds<0)return '00:00.000';const m=Math.floor(seconds/60),s=seconds%60;return String(m).padStart(2,'0')+':'+s.toFixed(3).padStart(6,'0')}
function loadStudioClips(){try{studioState.clips=JSON.parse(localStorage.getItem('monetiz_clips_'+state.user.email)||'[]')}catch{studioState.clips=[]}}
function saveStudioClips(){localStorage.setItem('monetiz_clips_'+state.user.email,JSON.stringify(studioState.clips))}
function renderClipList(){const box=$('#clip-list');if(!box)return;const clips=studioState.clips;box.innerHTML=clips.length?clips.map((c,i)=>`<div class="clip-row"><div><strong>${i+1}. ${esc(c.label||'Séquence sans titre')}</strong><small>${esc(c.fileName)}${c.note?' · '+esc(c.note):''}</small><span class="clip-time">${esc(fmtTime(c.start))} → ${esc(fmtTime(c.end))} · ${esc(fmtTime(c.end-c.start))}</span></div><button class="btn icon-only ghost danger" data-delete-clip="${c.id}" title="Retirer cette coupe">${icon('trash-2')}</button></div>`).join(''):`<div class="empty">${icon('scissors')}<div>Aucune coupe repérée.</div><p class="small">Les coupes que tu marques apparaîtront ici.</p></div>`;const count=$('#clip-count');if(count)count.textContent=clips.length+' coupe'+(clips.length!==1?'s':'');const exp=$('#export-clips'),clear=$('#clear-clips');if(exp)exp.disabled=!clips.length;if(clear)clear.disabled=!clips.length;$$('[data-delete-clip]').forEach(b=>b.onclick=()=>{studioState.clips=studioState.clips.filter(c=>c.id!==b.dataset.deleteClip);saveStudioClips();renderClipList()});if(window.lucide)lucide.createIcons()}
function updateStudioReadout(){const v=$('#studio-video');if(!v)return;$('#studio-current').textContent=fmtTime(v.currentTime);$('#studio-duration').textContent=Number.isFinite(v.duration)?fmtTime(v.duration):'--:--';$('#studio-in').textContent=fmtTime(studioState.in);$('#studio-out').textContent=studioState.out>0?fmtTime(studioState.out):'--:--.---';}
function initStudio(){const fileInput=$('#studio-file');if(!fileInput)return;loadStudioClips();const fileStatus=$('#studio-file-status');const stage=$('#video-stage');function setButtons(ok){['mark-in','mark-out','add-clip'].forEach(id=>$('#'+id).disabled=!ok)}fileInput.onchange=()=>{const file=fileInput.files?.[0];if(!file)return;if(studioState.url)URL.revokeObjectURL(studioState.url);studioState.file=file;studioState.url=URL.createObjectURL(file);studioState.in=0;studioState.out=0;stage.innerHTML=`<video id="studio-video" controls playsinline preload="metadata"></video>`;const video=$('#studio-video');video.src=studioState.url;video.ontimeupdate=updateStudioReadout;video.onloadedmetadata=()=>{fileStatus.textContent='Rush chargé';setButtons(true);updateStudioReadout()};video.onerror=()=>{fileStatus.textContent='Format non pris en charge';setButtons(false)};fileStatus.textContent=file.name.length>23?file.name.slice(0,20)+'…':file.name;setButtons(false);video.onloadedmetadata=()=>{fileStatus.textContent='Rush chargé';setButtons(true);updateStudioReadout()};};$('#mark-in').onclick=()=>{const v=$('#studio-video');if(!v)return;studioState.in=v.currentTime;studioState.out=0;updateStudioReadout();toast('Début marqué')};$('#mark-out').onclick=()=>{const v=$('#studio-video');if(!v)return;if(v.currentTime<=studioState.in)return toast('La fin doit être après le début');studioState.out=v.currentTime;updateStudioReadout();toast('Fin marquée')};$('#add-clip').onclick=()=>{const v=$('#studio-video');if(!v||!studioState.file)return;const end=studioState.out||v.currentTime;if(end<=studioState.in)return toast('Marque une fin après le début');studioState.clips.push({id:uid(),fileName:studioState.file.name,label:$('#clip-label').value.trim(),note:$('#clip-note').value.trim(),start:studioState.in,end});saveStudioClips();renderClipList();$('#clip-label').value='';$('#clip-note').value='';toast('Coupe ajoutée à la feuille de montage')};$$('[data-delete-clip]').forEach(b=>b.onclick=()=>{studioState.clips=studioState.clips.filter(c=>c.id!==b.dataset.deleteClip);saveStudioClips();renderClipList()});$('#clear-clips').onclick=()=>{if(confirm('Vider toutes les coupes enregistrées ?')){studioState.clips=[];saveStudioClips();renderClipList();toast('Feuille de montage vidée')}};$('#export-clips').onclick=()=>{const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const rows=[['#','Séquence','Fichier source','Début (secondes)','Fin (secondes)','Durée (secondes)','Timecode début','Timecode fin','Note'],...studioState.clips.map((c,i)=>[i+1,c.label,c.fileName,c.start.toFixed(3),c.end.toFixed(3),(c.end-c.start).toFixed(3),fmtTime(c.start),fmtTime(c.end),c.note])];const csv='\ufeff'+rows.map(r=>r.map(quote).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='monetiz-feuille-de-montage.csv';a.click();URL.revokeObjectURL(url);toast('Feuille de montage exportée')};updateStudioReadout()}

function notesHTML(){return `<div class="view-title"><div><div class="eyebrow">MÉMOIRE DE L’ÉQUIPE</div><h1>Notes & briefs</h1><p>Garde les idées, scripts et décisions au même endroit.</p></div><button class="btn primary" data-create="note">${icon('plus')} Nouvelle note</button></div><div class="editor-layout"><section class="panel"><h2>Notes enregistrées</h2><div class="notes-list">${state.data.notes.length?state.data.notes.slice().reverse().map(n=>`<div class="note-row"><span class="metric-icon">${icon('file-text')}</span><div><strong>${esc(n.title)}</strong><small>${esc(n.project||'Général')} · ${esc(n.updated||'')}</small></div><button class="btn icon-only ghost" data-edit-note="${n.id}" title="Ouvrir">${icon('arrow-up-right')}</button><button class="btn icon-only ghost danger" data-delete-note="${n.id}" title="Supprimer">${icon('trash-2')}</button></div>`).join(''):`<div class="empty">${icon('notebook-pen')}<div>Aucune note pour l’instant.</div></div>`}</div></section><aside class="panel"><h2>Un brief utile contient…</h2><div class="task-list"><div class="task"><span class="metric-icon">${icon('target')}</span><div class="task-text">Objectif<small>Quel résultat doit-on obtenir ?</small></div></div><div class="task"><span class="metric-icon">${icon('list-checks')}</span><div class="task-text">Étapes<small>Quelles actions concrètes sont nécessaires ?</small></div></div><div class="task"><span class="metric-icon">${icon('paperclip')}</span><div class="task-text">Ressources<small>Liens, fichiers, références et assets.</small></div></div></div><button class="btn" style="width:100%;margin-top:15px" data-create="note">${icon('file-plus-2')} Écrire une note</button></aside></div>`}
function bindPage(){ $$('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});$$('[data-create]').forEach(b=>b.onclick=()=>openForm(b.dataset.create));$$('[data-complete]').forEach(b=>b.onchange=()=>{const t=state.data.tasks.find(t=>t.id===b.dataset.complete);if(t){t.status=b.checked?'Terminée':'À faire';saveData();renderPage();toast(t.status==='Terminée'?'Tâche terminée':'Tâche rouverte')}});$$('[data-task-status]').forEach(s=>s.onchange=()=>{const t=state.data.tasks.find(t=>t.id===s.dataset.taskStatus);if(t){t.status=s.value;saveData();renderPage()}});if($('#task-search'))$('#task-search').oninput=e=>{const pos=e.target.selectionStart;state.search=e.target.value;const v=state.search;renderPage();const el=$('#task-search');el.focus();el.setSelectionRange(pos,pos)};if($('#task-filter'))$('#task-filter').onchange=e=>{state.filter=e.target.value;renderPage()};$$('[data-edit-project]').forEach(b=>b.onclick=()=>openForm('project',state.data.projects.find(p=>p.id===b.dataset.editProject)));$$('[data-delete-project]').forEach(b=>b.onclick=()=>{const p=state.data.projects.find(p=>p.id===b.dataset.deleteProject);if(confirm(`Supprimer le projet « ${p.name} » ? Les tâches associées seront conservées.`)){state.data.projects=state.data.projects.filter(x=>x.id!==p.id);saveData();renderPage();toast('Projet supprimé')}});$$('[data-edit-task]').forEach(b=>b.onclick=()=>openForm('task',state.data.tasks.find(t=>t.id===b.dataset.editTask)));$$('[data-delete-video]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette fiche de montage ?')){state.data.videos=state.data.videos.filter(v=>v.id!==b.dataset.deleteVideo);saveData();renderPage();toast('Fiche supprimée')}});$$('[data-edit-note]').forEach(b=>b.onclick=()=>openForm('note',state.data.notes.find(n=>n.id===b.dataset.editNote)));$$('[data-delete-note]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette note ?')){state.data.notes=state.data.notes.filter(n=>n.id!==b.dataset.deleteNote);saveData();renderPage();toast('Note supprimée')}});if(state.view==='videos')initStudio()}
function openCreateMenu(){const options=[['project','folder-plus','Créer un projet'],['task','list-plus','Ajouter une tâche'],['video','clapperboard','Préparer un montage'],['note','notebook-pen','Écrire une note']];$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="modal-head"><h2>Que veux-tu créer ?</h2><button class="btn icon-only ghost" id="close-modal">${icon('x')}</button></div><div class="project-list">${options.map(([type,ic,label])=>`<button class="project-row" style="width:100%;text-align:left;color:var(--text)" data-menu-create="${type}"><span class="project-icon">${icon(ic)}</span><span class="project-info"><strong>${label}</strong><span class="small muted">Ajouter à ton espace de travail</span></span>${icon('arrow-right')}</button>`).join('')}</div></div></div>`;$('#close-modal').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};$$('[data-menu-create]').forEach(b=>b.onclick=()=>openForm(b.dataset.menuCreate));if(window.lucide)lucide.createIcons()}
function closeModal(){$('#modal-root').innerHTML=''}
function openForm(type,item=null){closeModal();const editing=!!item;const cfg={project:{title:editing?'Modifier le projet':'Nouveau projet',fields:[['name','Nom du projet','text',true],['description','Description','textarea',false],['category','Catégorie','text',false],['status','Statut','select',true],['progress','Progression (%)','number',true]],statuses:['En cours','En pause','Terminé']},task:{title:editing?'Modifier la tâche':'Nouvelle tâche',fields:[['title','Titre','text',true],['description','Détails','textarea',false],['project','Projet associé','select',false],['status','Statut','select',true],['priority','Priorité','select',true],['due','Date limite','date',false]],statuses:['À faire','En cours','Terminée'],priorities:['Basse','Normale','Haute']},video:{title:editing?'Modifier le montage':'Préparer un montage vidéo',fields:[['title','Nom de la vidéo','text',true],['description','Brief / notes de montage','textarea',false],['format','Format','select',true],['status','Statut','select',true],['link','Lien vers les médias (URL)','url',false]],formats:['YouTube','Shorts / TikTok / Reels','Gameplay','Autre'],statuses:['À préparer','En cours','À vérifier','Exporté']},note:{title:editing?'Modifier la note':'Nouvelle note',fields:[['title','Titre','text',true],['project','Projet associé','select',false],['content','Contenu','textarea',false]],statuses:[]}}[type];if(!cfg)return;let fields='';for(const [key,label,kind,required] of cfg.fields){const val=item?.[key]??(key==='status'?(type==='project'?'En cours':type==='task'?'À faire':'À préparer'):key==='priority'?'Normale':key==='progress'?0:'');let control='';if(kind==='textarea')control=`<textarea class="textarea" name="${key}" placeholder="${label}" ${required?'required':''}>${esc(val)}</textarea>`;else if(kind==='select'){let options=key==='project'?(type==='task'||type==='note'?['',...state.data.projects.map(p=>p.name)]:[]):key==='status'?(cfg.statuses||[]):key==='priority'?(cfg.priorities||[]):key==='format'?(cfg.formats||[]):[];control=`<select class="select" name="${key}" ${required?'required':''}>${options.map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o||'Aucun projet')}</option>`).join('')}</select>`}else control=`<input class="input" name="${key}" type="${kind}" value="${esc(val)}" ${kind==='number'?'min="0" max="100"':''} ${required?'required':''} ${key==='link'?'placeholder="https://…"':''}>`;fields+=`<div class="field"><label>${label}</label>${control}</div>`}$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><form class="modal" id="entity-form"><div class="modal-head"><h2>${cfg.title}</h2><button class="btn icon-only ghost" type="button" id="close-modal">${icon('x')}</button></div>${fields}<div class="modal-actions"><button class="btn" type="button" id="cancel-modal">Annuler</button><button class="btn primary" type="submit">${editing?'Enregistrer':'Créer'}</button></div></form></div>`;$('#close-modal').onclick=closeModal;$('#cancel-modal').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};$('#entity-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),obj={};cfg.fields.forEach(([key])=>obj[key]=String(fd.get(key)??'').trim());if(type==='project')obj.progress=Math.min(100,Math.max(0,Number(obj.progress)||0));if(type==='project'&&!obj.name)return;if(type==='task'&&!obj.title)return;if(type==='video'&&obj.link&&!/^https?:\/\//i.test(obj.link)){toast('Le lien doit commencer par https:// ou http://');return}if(type==='note')obj.updated=new Date().toLocaleDateString('fr-FR');if(editing){Object.assign(item,obj)}else{obj.id=uid();if(type==='project')state.data.projects.unshift(obj);if(type==='task')state.data.tasks.unshift(obj);if(type==='video')state.data.videos.unshift(obj);if(type==='note')state.data.notes.push(obj)}saveData();closeModal();renderPage();toast(editing?'Modifications enregistrées':'Élément créé')};if(window.lucide)lucide.createIcons()}
render();
})();
